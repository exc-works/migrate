name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: migrate

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - goos: linux
            goarch: arm64
            arch_label: arm64
          - goos: darwin
            goarch: arm64
            arch_label: arm64
          - goos: darwin
            goarch: amd64
            arch_label: amd64
          - goos: linux
            goarch: amd64
            arch_label: x64
          - goos: linux
            goarch: 386
            arch_label: x86
          - goos: windows
            goarch: amd64
            arch_label: x64
          - goos: windows
            goarch: arm64
            arch_label: arm64
          - goos: windows
            goarch: 386
            arch_label: x86
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Build release binary
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ext=""
          if [ "${GOOS}" = "windows" ]; then
            ext=".exe"
          fi
          raw_name="${BINARY_NAME}_${GITHUB_REF_NAME}_${GOOS}_${{ matrix.platform.arch_label }}${ext}"
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.buildVersion=${GITHUB_REF_NAME}" -o "dist/${raw_name}" ./cmd/migrate
          if [ "${GOOS}" = "linux" ] && [ "${GOARCH}" = "amd64" ]; then
            capabilities=$("dist/${raw_name}" capabilities --output json)
            python3 -c 'import json,sys; assert json.loads(sys.argv[1])["formats"]==["sql","js","ts","mjs"]' "${capabilities}"
            cp docs/migration-api.d.ts dist/migration-api.d.ts
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform.goos }}-${{ matrix.platform.arch_label }}
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
