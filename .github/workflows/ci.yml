name: ci

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate hook scripts
        run: |
          bash -n .githooks/pre-commit
          bash -n scripts/install-git-hooks.sh
      - name: Test hook behavior
        run: ./scripts/test-pre-commit-hook.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download dependencies
        run: go mod download
      - name: Run script import examples
        run: ./scripts/test-script-examples.sh

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [postgres, mysql, mariadb, sqlite, clickhouse, tidb, mssql]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Download dependencies
        run: go mod download
      - name: Ensure Docker Is Healthy
        if: ${{ matrix.db != 'sqlite' }}
        run: docker info
      - name: Integration tests
        env:
          INTEGRATION_DB: ${{ matrix.db }}
        run: go test -tags=integration ./...

  integration-external:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [oracle, redshift, mssql]
    # Prevent workflow runs from modifying the dedicated external schema concurrently.
    concurrency:
      group: integration-external-${{ matrix.db }}
      cancel-in-progress: false
    env:
      INTEGRATION_ORACLE_DSN: ${{ secrets.INTEGRATION_ORACLE_DSN }}
      INTEGRATION_REDSHIFT_DSN: ${{ secrets.INTEGRATION_REDSHIFT_DSN }}
      INTEGRATION_MSSQL_DSN: ${{ secrets.INTEGRATION_MSSQL_DSN }}
    steps:
      - name: Check external DSN
        id: dsn
        env:
          DB_FLAVOR: ${{ matrix.db }}
        run: |
          case "$DB_FLAVOR" in
            oracle) selected_dsn="${INTEGRATION_ORACLE_DSN:-}" ;;
            redshift) selected_dsn="${INTEGRATION_REDSHIFT_DSN:-}" ;;
            mssql) selected_dsn="${INTEGRATION_MSSQL_DSN:-}" ;;
          esac
          if [ -n "$selected_dsn" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "$DB_FLAVOR DSN is not set; real-instance verification is skipped."
          fi
      - uses: actions/checkout@v6
        if: ${{ steps.dsn.outputs.available == 'true' }}
      - uses: actions/setup-go@v6
        if: ${{ steps.dsn.outputs.available == 'true' }}
        with:
          go-version-file: go.mod
      - name: Download dependencies
        if: ${{ steps.dsn.outputs.available == 'true' }}
        run: go mod download
      - name: Integration tests
        if: ${{ steps.dsn.outputs.available == 'true' }}
        env:
          INTEGRATION_DB: ${{ matrix.db }}
        run: go test -tags=integration ./integrationtest/...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build all
        run: go build ./...
      - name: Build CLI
        run: go build ./cmd/migrate
