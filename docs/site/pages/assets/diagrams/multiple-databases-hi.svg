  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #243451; text-anchor: middle; font-size: 17px; }
    .small { font-size: 14px; fill: #485b7a; }
    .box { fill: #eef3ff; stroke: #7690c5; stroke-width: 1.5; }
    .line { fill: none; stroke: #52688d; stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <rect width="720" height="248" rx="12" fill="#fafbff"/>
